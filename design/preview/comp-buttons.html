<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card"><div class="grain"></div>
<div class="row" style="gap:12px;align-items:center">
  <button style="background:#c9934b;color:#faf6ea;border:none;padding:10px 20px;border-radius:999px;font-family:Inter;font-weight:600;font-size:14px;box-shadow:0 0 18px rgba(201,147,75,.35);cursor:pointer">Record a thought</button>
  <button style="background:transparent;color:#1d2140;border:1px solid rgba(29,33,64,.18);padding:10px 20px;border-radius:999px;font-family:Inter;font-weight:500;font-size:14px;cursor:pointer">See the sky</button>
  <button style="background:#fdfaf1;color:#2e3458;border:1px solid rgba(29,33,64,.1);padding:10px 20px;border-radius:999px;font-family:Inter;font-weight:500;font-size:14px;cursor:pointer">Subtle</button>
  <button style="background:transparent;color:#c9934b;border:none;padding:10px 16px;font-family:Inter;font-weight:500;font-size:14px;cursor:pointer">Ghost</button>
  <button style="background:#c9934b;color:#faf6ea;border:none;padding:8px 16px;border-radius:999px;font-family:Inter;font-weight:600;font-size:12px;cursor:pointer">Small</button>
</div>
<div class="label" style="margin-top:14px">Primary · Secondary · Subtle · Ghost · Small</div>
</div></body></html>
