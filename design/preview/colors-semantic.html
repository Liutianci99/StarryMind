<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card"><div class="grain"></div>
<div class="row" style="gap:18px">
  <div class="col" style="gap:4px">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:36px;height:36px;border-radius:8px;background:var(--bg-canvas);border:1px solid var(--border-1)"></div>
      <div><div class="label">--bg-canvas</div><div class="value">body</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:36px;height:36px;border-radius:8px;background:var(--bg-surface);border:1px solid var(--border-1)"></div>
      <div><div class="label">--bg-surface</div><div class="value">card</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:36px;height:36px;border-radius:8px;background:var(--bg-raised);border:1px solid var(--border-1)"></div>
      <div><div class="label">--bg-raised</div><div class="value">popover</div></div>
    </div>
  </div>
  <div class="col" style="gap:4px">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:36px;height:36px;border-radius:8px;background:var(--fg-1)"></div>
      <div><div class="label">--fg-1</div><div class="value">primary</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:36px;height:36px;border-radius:8px;background:var(--fg-2)"></div>
      <div><div class="label">--fg-2</div><div class="value">body</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:36px;height:36px;border-radius:8px;background:var(--fg-3)"></div>
      <div><div class="label">--fg-3</div><div class="value">meta</div></div>
    </div>
  </div>
  <div class="col" style="gap:4px">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:36px;height:36px;border-radius:8px;background:var(--success)"></div>
      <div><div class="label">--success</div><div class="value">sage</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:36px;height:36px;border-radius:8px;background:var(--warning)"></div>
      <div><div class="label">--warning</div><div class="value">gold</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:36px;height:36px;border-radius:8px;background:var(--danger)"></div>
      <div><div class="label">--danger</div><div class="value">ember</div></div>
    </div>
  </div>
</div>
</div></body></html>
