<body><div class="card" style="padding:32px;background:#f6f1e1;background-image:radial-gradient(circle at 30% 40%,rgba(125,90,142,.12),transparent 55%),radial-gradient(circle at 75% 70%,rgba(201,147,75,.14),transparent 55%)"><div class="grain"></div>
