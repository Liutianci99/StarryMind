<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card"><div class="grain"></div>
<div class="label" style="margin-bottom:14px">Celestial body colors — used on stars / planets / satellites</div>
<div class="row">
  <div class="col"><div style="width:72px;height:72px;border-radius:50%;background:radial-gradient(circle,#f4ead2 0%,#e0b775 45%,#c9934b 85%);box-shadow:0 0 24px rgba(201,147,75,.5)"></div><div class="label">Star Gold</div><div class="value">#c9934b</div></div>
  <div class="col"><div style="width:72px;height:72px;border-radius:50%;background:radial-gradient(circle,#f0dfbe,#e0b775);box-shadow:0 0 16px rgba(224,183,117,.4)"></div><div class="label">Gold Soft</div><div class="value">#e0b775</div></div>
  <div class="col"><div style="width:72px;height:72px;border-radius:50%;background:radial-gradient(circle,#a98cc2,#7d5a8e);box-shadow:0 0 22px rgba(125,90,142,.4)"></div><div class="label">Plum</div><div class="value">#7d5a8e</div></div>
  <div class="col"><div style="width:72px;height:72px;border-radius:50%;background:radial-gradient(circle,#9badd1,#6a7bb0);box-shadow:0 0 22px rgba(106,123,176,.4)"></div><div class="label">Indigo</div><div class="value">#6a7bb0</div></div>
  <div class="col"><div style="width:72px;height:72px;border-radius:50%;background:radial-gradient(circle,#a8b8ad,#7a9080);box-shadow:0 0 20px rgba(122,144,128,.4)"></div><div class="label">Sage</div><div class="value">#7a9080</div></div>
  <div class="col"><div style="width:72px;height:72px;border-radius:50%;background:radial-gradient(circle,#e09a7b,#c8704e);box-shadow:0 0 22px rgba(200,112,78,.4)"></div><div class="label">Ember</div><div class="value">#c8704e</div></div>
</div>
</div></body></html>
