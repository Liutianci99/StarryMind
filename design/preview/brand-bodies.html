<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding:28px;background:#f6f1e1;background-image:radial-gradient(circle at 50% 50%,rgba(201,147,75,.14),transparent 65%)"><div class="grain"></div>
<div style="display:flex;gap:48px;align-items:center;justify-content:center;padding:16px">
  <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
    <div style="width:8px;height:8px;border-radius:50%;background:#7a9080;box-shadow:0 0 8px rgba(122,144,128,.5)"></div>
    <div style="font-family:Inter;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#878cac">Satellite</div>
    <div style="font-family:JetBrains Mono;font-size:10px;color:#878cac">&lt;100字</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
    <div style="width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#a98cc2,#7d5a8e);box-shadow:0 0 20px rgba(125,90,142,.4)"></div>
    <div style="font-family:Inter;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#878cac">Planet</div>
    <div style="font-family:JetBrains Mono;font-size:10px;color:#878cac">100-500字</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
    <div style="width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,#f4ead2 0%,#e0b775 40%,#c9934b 70%);box-shadow:0 0 28px rgba(201,147,75,.6),0 0 60px rgba(201,147,75,.25)"></div>
    <div style="font-family:Inter;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#9d7033">Star</div>
    <div style="font-family:JetBrains Mono;font-size:10px;color:#878cac">&gt;500字</div>
  </div>
</div>
<div class="label" style="margin-top:8px;text-align:center">Celestial body entities — satellite · planet · star</div>
</div></body></html>
