<!doctype html><html><head><meta charset="utf-8"><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="_card.css"></head>
<body><div class="card"><div class="grain"></div>
<div style="display:grid;grid-template-columns:repeat(10,1fr);gap:14px;color:#2e3458">
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i data-lucide="star"></i><span style="font-family:JetBrains Mono;font-size:9px;color:#878cac">star</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i data-lucide="sparkles"></i><span style="font-family:JetBrains Mono;font-size:9px;color:#878cac">sparkles</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i data-lucide="moon"></i><span style="font-family:JetBrains Mono;font-size:9px;color:#878cac">moon</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i data-lucide="search"></i><span style="font-family:JetBrains Mono;font-size:9px;color:#878cac">search</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i data-lucide="plus"></i><span style="font-family:JetBrains Mono;font-size:9px;color:#878cac">plus</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i data-lucide="settings"></i><span style="font-family:JetBrains Mono;font-size:9px;color:#878cac">settings</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i data-lucide="user"></i><span style="font-family:JetBrains Mono;font-size:9px;color:#878cac">user</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i data-lucide="hash"></i><span style="font-family:JetBrains Mono;font-size:9px;color:#878cac">hash</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i data-lucide="scan-search"></i><span style="font-family:JetBrains Mono;font-size:9px;color:#878cac">scan-search</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><i data-lucide="sliders-horizontal"></i><span style="font-family:JetBrains Mono;font-size:9px;color:#878cac">sliders</span></div>
</div>
<div class="label" style="margin-top:14px">Lucide · 1.5 stroke · 20px default</div>
<script>lucide.createIcons({attrs:{'stroke-width':1.5,width:22,height:22}});</script>
</div></body></html>
