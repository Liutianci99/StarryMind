<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card"><div class="grain"></div>
<div style="display:flex;flex-direction:column;gap:10px">
  <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fdfaf1;border:1px solid rgba(29,33,64,.1);border-radius:10px">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5a6086" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input placeholder="Search your thoughts…" style="background:transparent;border:none;color:#1d2140;outline:none;font-family:Inter;font-size:14px;flex:1"/>
  </div>
  <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fdfaf1;border:1px solid rgba(201,147,75,.5);border-radius:10px;box-shadow:0 0 0 2px rgba(201,147,75,.18)">
    <input value="A thought about memory" style="background:transparent;border:none;color:#1d2140;outline:none;font-family:Inter;font-size:14px;flex:1"/>
    <span style="font-family:JetBrains Mono;font-size:11px;color:#878cac">24</span>
  </div>
  <textarea placeholder="Whatever crosses your mind — write it down." style="background:#fdfaf1;border:1px solid rgba(29,33,64,.1);border-radius:10px;color:#2e3458;outline:none;padding:12px 14px;font-family:Inter;font-size:14px;line-height:1.6;resize:none;height:56px"></textarea>
</div>
<div class="label" style="margin-top:12px">Input · Focus · Textarea</div>
</div></body></html>
